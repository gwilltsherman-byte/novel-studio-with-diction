<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#20362b">
  <title>Novel Studio · Fiction and vocabulary</title>
  <link rel="stylesheet" href="journey.css?v=1">
  <script src="learning.js?v=1"></script>
  <script defer src="journey.js?v=1"></script>
  <style>
    :root { color-scheme:light; font:16px/1.5 "Avenir Next",Avenir,system-ui,sans-serif; color:#213c30; background:#f9f8f2; }
    * { box-sizing:border-box; }
    html,body { height:100%; margin:0; }
    #combined-studio { display:flex; flex-direction:column; height:100vh; height:100dvh; min-height:240px; }
    [hidden] { display:none!important; }
    .cs-bar { flex:none; display:flex; align-items:center; gap:clamp(.75rem,2.5vw,2rem); flex-wrap:wrap; padding:.65rem clamp(.75rem,2.4vw,1.65rem); color:#faf8e9; background:#20362b; }
    .cs-name { font:500 clamp(1.35rem,3vw,1.9rem)/1.15 "Iowan Old Style","Palatino Linotype",Georgia,serif; letter-spacing:-.04em; white-space:nowrap; }
    .cs-tabs { display:inline-flex; gap:2px; padding:3px; border:1px solid #6d8170; border-radius:7px; }
    .cs-tabs button { border:0; border-radius:4px; padding:.5rem .9rem; font-family:inherit; font-weight:550; line-height:1.25; font-size:.9rem; color:#e8ede3; background:transparent; cursor:pointer; }
    .cs-tabs button[aria-selected=true] { background:#f0efd9; color:#20362b; }
    .cs-tabs button[aria-selected=false]:hover { background:#344b3e; }
    .cs-bar :focus-visible { outline:2px solid #e9ca85; outline-offset:3px; }
    #journey-button { margin-left:auto; }
    #combined-studio>[role=tabpanel] { flex:1 1 0; min-height:0; min-width:0; }
    iframe { display:block; border:0; width:100%; height:100%; background:#f9f8f2; }
    @media(max-width:520px) { .cs-bar { gap:.4rem .6rem; padding:.4rem .65rem; } .cs-tabs button { padding:.42rem .48rem; } }
    @media(max-width:375px) { .cs-name { font-size:1.2rem; } .cs-bar { column-gap:.4rem; } }
    @media(pointer:coarse) { .cs-tabs button { min-height:40px; } }
  </style>
</head>
<body>
  <main id="combined-studio" aria-label="Novel Studio">
    <header class="cs-bar">
      <span class="cs-name">Novel Studio</span>
      <nav class="cs-tabs" role="tablist" aria-label="Study tools">
        <button type="button" role="tab" id="lessons-tab" aria-selected="true" aria-controls="lessons-pane">Lessons</button>
        <button type="button" role="tab" id="diction-tab" tabindex="-1" aria-selected="false" aria-controls="diction-pane">Vocabulary</button>
      </nav>
      <button id="journey-button" type="button" aria-haspopup="dialog" aria-controls="learning-journey">Learning progress</button>
    </header>
    <section role="tabpanel" id="lessons-pane" aria-labelledby="lessons-tab"></section>
    <section role="tabpanel" id="diction-pane" aria-labelledby="diction-tab" hidden></section>
  </main>
  <noscript>Enable JavaScript to study the fiction and vocabulary courses.</noscript>
  <script>
  (() => {
    "use strict";
    const $ = id => document.getElementById(id);
    const tabs = {lessons:$("lessons-tab"), diction:$("diction-tab")};
    const panels = {lessons:$("lessons-pane"), diction:$("diction-pane")};
    const isTrack = track => track === "fiction" || track === "vocabulary";
    const isLesson = (track, id) => /^week-(?:[1-9]|1[0-9]|20)$/.test(id) || (track === "fiction" && id === "map");
    let active, lessonFrame, readerReady = false, dictionFrame, dictionary, wordRequest;
    let currentLesson, requested, queuedAction;
    const lastByTrack = {};
    const queues = {lessons:null, diction:null};

    function address(hash, replace = false) {
      if (location.hash !== hash) history[replace ? "replaceState" : "pushState"](null, "", hash);
    }
    function activate(name) {
      if (active === "diction" && name !== "diction") dictionary?.onHidden?.();
      active = name;
      for (const [key, tab] of Object.entries(tabs)) {
        const selected = key === name;
        tab.setAttribute("aria-selected", String(selected));
        tab.tabIndex = selected ? 0 : -1;
        panels[key].hidden = !selected;
      }
    }
    function sendLesson() {
      if (!readerReady || active !== "lessons" || !requested) return;
      lessonFrame.contentWindow.postMessage({type:"ns-open-lesson", ...requested, action:queuedAction}, location.origin);
      queuedAction = undefined;
    }
    function showLessons(track, lesson, action) {
      requested = {track, lesson};
      queuedAction = action;
      activate("lessons");
      if (lessonFrame) { sendLesson(); return; }
      loadLessons(track,lesson);
    }
    function loadLessons(track,lesson) {
      lessonFrame = document.createElement("iframe");
      lessonFrame.title = "Fiction and vocabulary lessons";
      lessonFrame.addEventListener("load", () => { readerReady = true; sendLesson(); });
      lessonFrame.src = "lessons/index.html?v=3#" + track + (lesson ? "/" + lesson : "");
      panels.lessons.append(lessonFrame);
    }
    function updateReview(kind, info) {
      if (!info || !Number.isSafeInteger(info.due) || info.due < 0) return;
      queues[kind] = {due:info.due, nextDue:Number.isFinite(info.nextDue) ? info.nextDue : null};
      const seen = Object.values(queues).filter(Boolean);
      const times = seen.map(q => q.nextDue).filter(Number.isFinite);
      window.NovelJourney?.setReviewStatus({due:seen.reduce((acc,q) => acc+q.due,0),nextDue:times.length ? Math.min(...times) : null});
    }
    function syncDictionary() {
      if (!dictionary || active !== "diction") return;
      dictionary.onVisible?.();
      const request = wordRequest;
      wordRequest = null;
      if (request?.action === "review") dictionary.openReview?.();
      else if (request?.word) dictionary.openContext({action:"lookup",word:request.word});
      if (dictionary.reviewStatus) updateReview("diction",dictionary.reviewStatus());
    }
    function loadDiction() {
      if (dictionFrame) return;
      dictionFrame = document.createElement("iframe");
      dictionFrame.title = "Diction vocabulary tools";
      dictionFrame.src = "diction/index.html?v=3";
      panels.diction.append(dictionFrame);
    }
    function showDiction(request) {
      wordRequest = request;
      activate("diction");
      loadDiction();
      syncDictionary();
    }
    function followLocation() {
      const url = new URL(location.href);
      const rawAction = url.searchParams.get("activity");
      const action = ["apply","practice","review"].includes(rawAction) ? rawAction : undefined;
      if (rawAction !== null) {
        url.searchParams.delete("activity");
        history.replaceState(null, "", url);
      }
      if (location.hash === "#vocabulary") {
        showDiction(action === "review" ? {action:"review"} : undefined);
        return;
      }
      const match = /^#lessons(?:\/(fiction|vocabulary)(?:\/([a-z0-9-]+))?)?\/?$/.exec(location.hash);
      const track = match?.[1] || currentLesson?.track || "fiction";
      const id = match?.[2] && isLesson(track, match[2]) ? match[2] : undefined;
      if (!match || (match[2] && !id)) address("#lessons/" + track,true);
      showLessons(track,id,action);
    }
    function select(name) {
      if (name === active) return;
      if (name === "diction") {
        address("#vocabulary");
        showDiction();
      } else {
        const {track, lesson} = currentLesson || {track:"vocabulary"};
        address("#lessons/" + track + (lesson ? "/" + lesson : ""));
        showLessons(track,lesson);
      }
    }

    window.addEventListener("message", event => {
      if (!lessonFrame || event.source !== lessonFrame.contentWindow || event.origin !== location.origin) return;
      const msg = event.data;
      if (msg?.type === "ns-review-status") { updateReview("lessons",msg); return; }
      if (active !== "lessons") return;
      if (msg?.type === "ns-lesson-workspace" && msg.workspace === "diction") {
        address("#vocabulary");
        const word = typeof msg.word === "string" ? msg.word.trim().slice(0,120) : "";
        showDiction(word ? {word} : null);
        tabs.diction.focus({preventScroll:true});
        return;
      }
      if (msg?.type !== "ns-lesson-change" || !isTrack(msg.track) || !isLesson(msg.track,msg.lesson)) return;
      if (requested && (msg.track !== requested.track || (requested.lesson && msg.lesson !== requested.lesson))) return;
      const resolving = Boolean(requested);
      currentLesson = {track:msg.track, lesson:msg.lesson};
      lastByTrack[msg.track] = msg.lesson;
      // Keep an unsent initial action until the reader iframe is ready.
      requested = !readerReady ? currentLesson : null;
      address("#lessons/" + msg.track + "/" + msg.lesson,resolving);
    });
    window.addEventListener("hashchange",followLocation);
    window.addEventListener("ns-journey-action", event => {
      const {action,track} = event.detail || {};
      if (!isTrack(track) || !["apply","practice","review"].includes(action)) return;
      if (action === "review" && !queues.lessons?.due && queues.diction) {
        const words = queues.diction;
        if (words.due || (words.nextDue && words.nextDue < (queues.lessons?.nextDue ?? Infinity))) {
          address("#vocabulary");
          showDiction({action:"review"});
          return;
        }
      }
      const id = lastByTrack[track];
      address("#lessons/" + track + (id ? "/" + id : ""));
      showLessons(track,id,action);
    });
    for (const [name,tab] of Object.entries(tabs)) {
      tab.addEventListener("click", () => select(name));
      tab.addEventListener("keydown", event => {
        if (!["ArrowLeft","ArrowRight","Home","End"].includes(event.key)) return;
        event.preventDefault();
        const target = event.key === "Home" ? "lessons" : event.key === "End" ? "diction" : name === "lessons" ? "diction" : "lessons";
        select(target);
        tabs[target].focus();
      });
    }
    window.CombinedStudio = {
      register(name,adapter) {
        if (name !== "diction" || !adapter) return;
        dictionary = adapter;
        try { localStorage.setItem("ns.diction.used","1"); } catch { /* progress may be session-only */ }
        if (dictionary.reviewStatus) updateReview("diction",dictionary.reviewStatus());
        syncDictionary();
      },
      updateDictionReview(info) { updateReview("diction",info); }
    };
    $("journey-button").addEventListener("click", () => {
      if (!lessonFrame) loadLessons("vocabulary");
      if (dictionary?.reviewStatus) updateReview("diction",dictionary.reviewStatus());
      else { try { if (localStorage.getItem("ns.diction.used")) loadDiction(); } catch { /* use available sources */ } }
    });
    followLocation();
  })();
  </script>
</body>
</html>
