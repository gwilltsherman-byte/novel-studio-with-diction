<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#20362b">
  <title>Novel Studio · Writing, vocabulary and lessons</title>
  <style>
    #combined-studio{--cs-ink:#213c30;--cs-paper:#f9f8f2;--cs-rule:#ccd3c5;display:block;isolation:isolate;background:var(--cs-paper);color:var(--cs-ink);font:16px/1.5 "Avenir Next",Avenir,system-ui,sans-serif}
#combined-studio>.cs-bar{background:#20362b;color:#faf8e9}
#combined-studio .cs-toolbar{display:flex;align-items:center;gap:clamp(16px,3vw,34px);padding:11px clamp(14px,2.4vw,26px);flex-wrap:wrap}
#combined-studio .cs-name{flex:none;font:500 clamp(23px,3.3vw,31px)/1.2 "Iowan Old Style","Palatino Linotype",Georgia,serif;letter-spacing:-.045em;white-space:nowrap}
#combined-studio .cs-tabs{display:inline-flex;align-items:stretch;gap:2px;border:1px solid #6d8170;border-radius:7px;padding:3px}
#combined-studio .cs-tabs button,#combined-studio .cs-return{border:0;font:500 14px/1.25 "Avenir Next",Avenir,system-ui,sans-serif;cursor:pointer}
#combined-studio .cs-tabs button{color:#e8ede3;background:transparent;border-radius:4px;padding:8px 14px}
#combined-studio .cs-tabs button[aria-selected=true]{background:#f0efd9;color:#20362b}
#combined-studio .cs-tabs button[aria-selected=false]:hover{background:#344b3e}
#combined-studio .cs-draft{display:flex;align-items:center;gap:10px;margin-left:auto;min-width:0;max-width:44%}
#combined-studio .cs-place{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;color:#d3ddce}
#combined-studio .cs-return{flex:none;color:#fcf9e9;background:none;padding:8px 0;text-decoration:underline;text-underline-offset:3px}
#combined-studio .cs-tabs button:focus-visible,#combined-studio .cs-return:focus-visible{outline:2px solid #e9ca85;outline-offset:2px}
#combined-studio>.cs-status{margin:0;padding:8px 18px;background:#f3ecd2;font-size:14px;color:#382f1f;border-bottom:1px solid var(--cs-rule)}
#combined-studio>[role=tabpanel]{display:block;min-width:0}
#combined-studio [hidden]{display:none!important}
@media(max-width:720px){#combined-studio .cs-draft{flex:1 0 100%;max-width:100%;justify-content:space-between;padding-top:5px;border-top:1px solid #526858}#combined-studio .cs-toolbar{gap:7px 14px}#combined-studio .cs-tabs{margin-left:auto}}
@media(max-width:400px){#combined-studio .cs-tabs button{padding:8px 9px}#combined-studio .cs-toolbar{padding-inline:10px;gap:5px 8px}}
@media(pointer:coarse){#combined-studio .cs-tabs button,#combined-studio .cs-return{min-height:44px}}
@media(max-width:480px){#combined-studio .cs-toolbar{gap:6px 12px;padding:7px 12px}#combined-studio .cs-name{font-size:22px}#combined-studio .cs-tabs button{padding-inline:9px}}
@media(max-width:370px){#combined-studio .cs-tabs{margin-left:0}#combined-studio .cs-toolbar{column-gap:8px}}

    html,body{height:100%;margin:0;background:#f9f8f2}
    #combined-studio{display:flex;flex-direction:column;height:100vh;height:100dvh;min-height:260px}
    #combined-studio>.cs-bar,#combined-studio>.cs-status{flex:0 0 auto}
    #combined-studio>[role=tabpanel]{flex:1 1 0;min-height:0}
    #combined-studio iframe{display:block;border:0;width:100%;height:100%;background:#f9f8f2}
  </style>
</head>
<body>
  <section id="combined-studio" aria-label="Novel Studio">
  <header class="cs-bar">
    <div class="cs-toolbar">
      <span class="cs-name">Novel Studio</span>
      <div class="cs-tabs" role="tablist" aria-label="Studio workspace">
        <button type="button" role="tab" id="cs-writing-tab" aria-controls="cs-writing-pane" aria-selected="true" data-cs-app="novel">Writing</button>
        <button type="button" role="tab" id="cs-words-tab" aria-controls="cs-words-pane" aria-selected="false" tabindex="-1" data-cs-app="diction">Vocabulary</button>
        <button type="button" role="tab" id="cs-lessons-tab" aria-controls="cs-lessons-pane" aria-selected="false" tabindex="-1" data-cs-app="lessons">Lessons</button>
      </div>
      <div class="cs-draft" hidden>
        <span class="cs-place"></span>
        <button type="button" class="cs-return">Return to draft</button>
      </div>
    </div>
  </header>
  <p class="cs-status" role="status" aria-live="polite" hidden></p>
  <div id="cs-writing-pane" role="tabpanel" aria-labelledby="cs-writing-tab" tabindex="-1"><iframe id="cs-novel-frame" title="Writing workspace"></iframe></div>
  <div id="cs-words-pane" role="tabpanel" aria-labelledby="cs-words-tab" tabindex="-1" hidden><iframe id="cs-diction-frame" title="Vocabulary workspace"></iframe></div>
  <div id="cs-lessons-pane" role="tabpanel" aria-labelledby="cs-lessons-tab" tabindex="-1" hidden></div>
</section>

  <noscript>Enable JavaScript to use Novel Studio.</noscript>
  
  
  <script>
    (() => {
  'use strict';
  const root = document.getElementById('combined-studio');
  if (!root || root.combinedStudio) return;
  const tabs = [...root.querySelectorAll('[data-cs-app]')];
  const panels = {novel:root.querySelector('#cs-writing-pane'), diction:root.querySelector('#cs-words-pane'), lessons:root.querySelector('#cs-lessons-pane')};
  const draft = root.querySelector('.cs-draft');
  const place = root.querySelector('.cs-place');
  const back = root.querySelector('.cs-return');
  const status = root.querySelector('.cs-status');
  const adapters = {};
  let active = 'novel', context = null, waiting = null;
  let previousWorkspace = 'novel', lessonFrame = null, readerLoaded = false;
  let requestedLesson = null;

  function setHash(hash, replace = false) {
    if (location.hash === hash) return;
    if (replace) history.replaceState(null, '', hash);
    else history.pushState(null, '', hash);
  }
  function sendLesson() {
    if (!readerLoaded || !requestedLesson || active !== 'lessons') return;
    lessonFrame.contentWindow.postMessage({type:'ns-open-lesson', ...requestedLesson}, location.origin);
  }
  function openLessons(track, lesson) {
    if (active !== 'lessons') previousWorkspace = active;
    requestedLesson = {track, lesson};
    active = 'lessons';
    tell();
    paint();
    if (lessonFrame) {
      sendLesson();
      return;
    }
    lessonFrame = document.createElement('iframe');
    lessonFrame.title = 'Fiction and vocabulary lessons';
    lessonFrame.addEventListener('load', () => {
      readerLoaded = true;
      sendLesson();
    });
    lessonFrame.src = 'lessons/index.html?v=2#' + track + (lesson ? '/' + lesson : '');
    panels.lessons.appendChild(lessonFrame);
  }
  function followLocation() {
    const route = /^#lessons(?:\/(fiction|vocabulary)(?:\/([a-z0-9-]+))?)?\/?$/.exec(location.hash);
    if (route) openLessons(route[1] || (active === 'diction' ? 'vocabulary' : 'fiction'), route[2]);
    else if (location.hash === '#vocabulary') openVocabulary(null, false);
    else openWriting(false);
  }
  window.addEventListener('hashchange', followLocation);
  window.addEventListener('message', event => {
    if (active !== 'lessons' || !lessonFrame || event.source !== lessonFrame.contentWindow ||
        event.origin !== location.origin) return;
    const msg = event.data;
    if (msg?.type === 'ns-lesson-workspace' && (msg.workspace === 'novel' || msg.workspace === 'diction')) {
      const word = typeof msg.word === 'string' ? msg.word.trim().slice(0,120) : '';
      if (msg.workspace === 'diction' && word) {
        openVocabulary({...adapters.novel?.getContext?.(), action:'lookup', word});
      } else select(msg.workspace);
      tabs.find(tab => tab.dataset.csApp === msg.workspace)?.focus();
    }
    if (msg?.type !== 'ns-lesson-change' || !['fiction','vocabulary'].includes(msg.track) ||
        typeof msg.lesson !== 'string' || !/^[a-z0-9-]+$/.test(msg.lesson)) return;
    const resolvingTrack = !requestedLesson.lesson;
    requestedLesson = {track:msg.track, lesson:msg.lesson};
    setHash('#lessons/' + msg.track + '/' + msg.lesson, resolvingTrack);
  });

  function tell(text = '') {
    status.textContent = text;
    status.hidden = !text;
  }
  function paint() {
    for (const tab of tabs) {
      const id = tab.dataset.csApp, selected = active === id;
      tab.setAttribute('aria-selected',String(selected));
      tab.tabIndex = selected ? 0 : -1;
      panels[id].hidden = !selected;
    }
    const manuscript = context?.bookTitle || context?.projectTitle || '';
    const scene = context?.chapterTitle || context?.sceneTitle || '';
    place.textContent = [manuscript,scene].filter(Boolean).join(' · ');
    place.title = place.textContent;
    draft.hidden = active !== 'diction' || !context?.hasTarget;
  }
  function applyVocabulary() {
    const diction = adapters.diction;
    if (!diction || active !== 'diction') return;
    const request = waiting;
    waiting = null;
    if (!request) diction.clear?.();
    diction.onVisible?.(context);
    if (request) diction.openContext?.(request);
  }
  function openVocabulary(request, updateHash = true) {
    if (updateHash) setHash('#vocabulary');
    if (active === 'lessons' && previousWorkspace === 'diction' && !request) {
      active = 'diction';
      tell();
      paint();
      return;
    }
    tell();
    context = request || adapters.novel?.getContext?.() || null;
    waiting = request || null;
    active = 'diction';
    paint();
    if (request) panels.diction.focus({preventScroll:true});
    applyVocabulary();
  }
  function openWriting(updateHash = true) {
    if (updateHash) setHash('#writing');
    if (active === 'diction' || (active === 'lessons' && previousWorkspace === 'diction')) adapters.diction?.onHidden?.();
    waiting = null;
    active = 'novel';
    paint();
    adapters.novel?.onVisible?.();
  }
  function canUseWord() {
    return Boolean(context?.canInsert && adapters.novel?.insertWord);
  }
  function useWord(word) {
    if (!canUseWord() || typeof word !== 'string' || !word.trim()) {
      const result = {ok:false,message:'Choose a place in your manuscript before inserting a word.'};
      tell(result.message);
      return result;
    }
    openWriting();
    const result = adapters.novel.insertWord(word.trim());
    if (result === false || result?.ok === false) {
      tell(result?.message || 'The passage has changed. Choose a new insertion point.');
    } else {
      tell();
    }
    return result;
  }
  function returnToDraft() {
    tell();
    openWriting();
    if (!context?.hasTarget) return false;
    const result = adapters.novel?.returnToDraft?.();
    if (result === false || result?.ok === false) {
      tell(result?.message || 'The original passage is no longer available.');
    }
    return result;
  }
  function select(id) {
    if (active === id) return;
    if (id === 'lessons') {
      const track = active === 'diction' ? 'vocabulary' : 'fiction';
      setHash('#lessons/' + track);
      openLessons(track);
    } else if (id === 'diction') openVocabulary();
    else {tell(); openWriting();}
  }
  for (const [index, tab] of tabs.entries()) {
    tab.addEventListener('click',() => select(tab.dataset.csApp));
    tab.addEventListener('keydown',event => {
      const keys = ['ArrowLeft','ArrowRight','Home','End'];
      if (!keys.includes(event.key)) return;
      event.preventDefault();
      const offset = event.key === 'ArrowLeft' ? -1 : 1;
      const next = tabs[event.key === 'Home' ? 0 : event.key === 'End' ? tabs.length-1 : (index + offset + tabs.length) % tabs.length];
      select(next.dataset.csApp);
      next.focus();
    });
  }
  back.addEventListener('click',returnToDraft);
  const hub = {
    roots:{}, openVocabulary, returnToDraft, useWord, canUseWord, getContext:() => context,
    get active() {return active;},
    register(id,adapter) {
      if (!Object.hasOwn(panels,id) || !adapter) return;
      adapters[id] = adapter;
      if (id === 'diction' && active === 'diction') applyVocabulary();
    }
  };
  root.combinedStudio = window.CombinedStudio = hub;
  followLocation();
})();

    for (const area of ['novel','diction']) {
      document.getElementById('cs-'+area+'-frame').src=area+'/index.html';
    }
  </script>
</body>
</html>
